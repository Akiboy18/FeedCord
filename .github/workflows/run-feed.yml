name: Execute Daily RF News Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize .NET Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0' # Updated to match your project build configuration log

      - name: Install System Dependencies
        run: dotnet restore FeedCord/FeedCord.csproj

      - name: Run Feed Reader App
        run: dotnet run --project FeedCord/FeedCord.csproj -- $GITHUB_WORKSPACE/appsettings.json
